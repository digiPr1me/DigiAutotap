name: Something does not work
description: A task taps the wrong thing, stops, or does nothing at all
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. One thing makes a report easy to act
        on: **the log**. In the app, open *Settings*, then *Log*, and tap
        *Share* right after the problem happened (on 1.2: *Share debug
        package*), save the ZIP, and drag it into the box below. It holds the
        log, the settings and the phone model -- no pictures, and nothing else
        from the phone. If it is about a screen of the game, add a screenshot.

  - type: dropdown
    id: task
    attributes:
      label: Which task?
      options:
        - Bond token
        - World Search
        - Summon
        - Meat Field
        - Dungeons
        - Quest Loop
        - Gekkomon Run
        - Chef's Special
        - EX Missions
        - Presets
        - The app itself (setup, the dot, the notification)
        - Supporter code
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I switched on Dungeons and opened the dungeon list. It played the
        first dungeon, then went back to the list and did nothing more.
    validations:
      required: true

  - type: textarea
    id: package
    attributes:
      label: The log
      description: >
        Drag the ZIP from Settings -> Log -> Share in here (on 1.2: "Share
        debug package"). Without it a report usually cannot be answered.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DigiAutotap version
      description: Shown under Settings, in the Version row.
      placeholder: "1.3"
    validations:
      required: true

  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: "Poco F3, Android 14 (HyperOS)"
    validations:
      required: true
