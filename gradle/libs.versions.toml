[versions]
agp = "9.4.1"
kotlin = "2.4.20"
# The same OpenCV on all three sides -- Python, the JVM tests, the Android
# build (NOTES.md, "Two implementations, one direction"). Python reports
# 5.0.0 (opencv-python 5.0.0.93). Maven Central has org.opencv:opencv from
# 4.9.0 on, 5.0.0 among them; 5.0.0.1 is a repackaging of the same release.
# The desktop side has no Maven artifact at 5.0.0 (org.openpnp stops at
# 4.9.0, org.bytedeco at 4.14.0 and is a different API), so the core tests
# use opencv-500.jar and opencv_java500.dll from the official
# opencv-5.0.0-windows.exe -- see opencv.dir in README.md.
opencv = "5.0.0"
serialization = "1.11.0"
junit = "6.1.3"

[libraries]
opencv-android = { module = "org.opencv:opencv", version.ref = "opencv" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
